# Local run of the pilot with Docker (the homelab uses deploy/k8s instead).
#   cp .env.example .env   # set PILOT_ADMIN_TOKEN
#   docker compose up --build   →  http://localhost:3000
services:
  web:
    build: ./src/web
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api

  api:
    build: ./src/api
    # Not published: the browser reaches it only through the web service's /api proxy.
    volumes:
      - pilot-data:/data
    environment:
      - PILOT_ADMIN_TOKEN=${PILOT_ADMIN_TOKEN:?set PILOT_ADMIN_TOKEN in .env}
      - PILOT_COOKIE_SECURE=false # plain http on localhost

volumes:
  pilot-data:
