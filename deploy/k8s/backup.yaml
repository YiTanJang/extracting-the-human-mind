# Daily consistent SQLite snapshot into the same volume (keeps 14).
# This protects against bad writes, not against losing the node — copy /data/backups off the node too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: backup
              image: ghcr.io/yitanjang/ethm-pilot-api:latest
              command:
                - python
                - -c
                - |
                  import sqlite3, pathlib, datetime
                  out = pathlib.Path("/data/backups"); out.mkdir(exist_ok=True)
                  stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
                  src = sqlite3.connect("/data/pilot.db"); dst = sqlite3.connect(out / f"pilot-{stamp}.db")
                  src.backup(dst); dst.close(); src.close()
                  for old in sorted(out.glob("pilot-*.db"))[:-14]:
                      old.unlink()
                  print("backup ok", stamp)
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pilot-data
