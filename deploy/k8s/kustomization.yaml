apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ethm-pilot
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - networkpolicy.yaml
  - backup.yaml
# Pin a build: kubectl kustomize edit / or set newTag to a sha tag from GHCR.
images:
  - name: ghcr.io/yitanjang/ethm-pilot-api
    newTag: latest
  - name: ghcr.io/yitanjang/ethm-pilot-web
    newTag: latest
