apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pilot-data
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName omitted → cluster default (k3s: local-path).
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1 # SQLite on a RWO volume: exactly one writer.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/yitanjang/ethm-pilot-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: PILOT_DATABASE_URL
              value: sqlite:////data/pilot.db
            - name: PILOT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: pilot-secrets, key: admin-token }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pilot-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
