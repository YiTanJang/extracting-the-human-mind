# cloudflared runs on the host and forwards the public hostname to Traefik (k3s default, ports 80/443).
# Set `host` to the Cloudflare Tunnel public hostname before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik
  rules:
    - host: pilot.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
