# The API holds participant data; only the web pods may reach it over the network.
# (The backup job reads the volume directly and needs no network access to the API.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-from-web-only
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: web }
      ports:
        - port: 8000
